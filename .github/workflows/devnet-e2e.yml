# Two logos-mcp servers against each other on a local LEZ devnet: scripts/e2e.py
# --devnet sends a message, shares a file, pays and finds the other. Messaging,
# storage and discovery go through the devnet's own hub, so nothing reaches a public
# network.
name: devnet e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: devnet-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # The devnet runs in Docker, so it needs a Linux runner.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked
      # Installs logosctl for the sessions, then starts the devnet from logos-devnet.toml:
      # a session per server, the messaging hub and shared storage.
      - uses: drptbl/logos-devnet@323ed249cf2faf2f4305d171c173a574c25fc416 # v0.9.4
      - run: python3 scripts/e2e.py --devnet
      # Each server's log, which the script keeps in a logos-mcp-e2e-* folder.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devnet-e2e-logs
          path: /tmp/logos-mcp-e2e-*
          if-no-files-found: ignore
