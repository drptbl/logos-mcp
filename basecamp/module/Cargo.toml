[package]
name = "logos_mcp_module"
version = "0.1.0"
edition = "2021"

# Standalone crate: built by logos-module-builder, not part of the repo's workspace.
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
# The library from this repo, copied here by flake.nix (locally a gitignored symlink).
logos-mcp = { path = "vendor/logos-mcp", default-features = false, features = ["module"] }
# Staged by the builder (and locally by `nix build ...#rust-sdk-src`), same rev as the generator.
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tokio-util = "0.7"
