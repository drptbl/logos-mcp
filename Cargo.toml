[package]
name = "logos-mcp"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "MCP server that lets AI agents use a running Logos node: messaging, storage and node status"
license = "MIT OR Apache-2.0"
repository = "https://github.com/drptbl/logos-mcp"
readme = "README.md"
keywords = ["mcp", "logos", "ai-agents", "p2p", "privacy"]
categories = ["command-line-utilities", "network-programming"]

[features]
default = ["cli"]
# The standalone binary. Library users (the Basecamp module) turn it off.
cli = ["dep:anyhow", "dep:clap", "dep:tracing-subscriber"]
# What the Basecamp module needs: MCP over HTTP with a token, and its config file.
module = ["dep:axum", "rmcp/transport-streamable-http-server"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "logos-mcp"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
getrandom = "0.3"
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "fs"] }
tokio-util = "0.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }

[dev-dependencies]
http-body-util = "0.1"
rmcp = { version = "3.9.0", features = ["client", "transport-async-rw"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
